<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIZR</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap');

  :root {
    --bg: #080808;
    --panel: #111111;
    --border: #222222;
    --accent: #00e5ff;
    --accent2: #ff3d71;
    --text: #c8c8c8;
    --dim: #555;
    --on: #00e5ff;
    --off: #2a2a2a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 20px 40px;
    gap: 20px;
  }

  header {
    width: 100%;
    max-width: 1280px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }

  .logo {
    font-family: 'Space Mono', monospace;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.15em;
    color: #fff;
  }
  .logo span { color: var(--accent); }

  .tagline {
    font-size: 12px;
    color: var(--dim);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-family: 'Space Mono', monospace;
  }

  /* Canvas wrapper */
  #canvas-wrap {
    position: relative;
    width: 1280px;
    max-width: 100%;
    border-radius: 6px;
    overflow: hidden;
    background: #000;
    box-shadow: 0 0 0 1px var(--border), 0 20px 60px rgba(0,0,0,0.7);
  }

  canvas {
    display: block;
    width: 100%;
    aspect-ratio: 16/9;
  }

  /* Recording pill */
  #rec-pill {
    position: absolute;
    top: 14px;
    right: 14px;
    background: rgba(10,10,10,0.85);
    border: 1px solid var(--accent2);
    border-radius: 20px;
    padding: 4px 12px;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--accent2);
    display: none;
    align-items: center;
    gap: 6px;
    backdrop-filter: blur(8px);
  }
  #rec-pill.visible { display: flex; }
  .rec-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--accent2);
    animation: blink 1s step-start infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* Controls panel */
  #controls {
    width: 100%;
    max-width: 1280px;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 16px;
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 18px 20px;
  }

  .panel-label {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--dim);
    margin-bottom: 14px;
  }

  /* Upload area */
  #drop-zone {
    border: 1.5px dashed var(--border);
    border-radius: 4px;
    padding: 20px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
    position: relative;
  }
  #drop-zone:hover, #drop-zone.drag-over {
    border-color: var(--accent);
    background: rgba(0,229,255,0.03);
  }
  #drop-zone input[type=file] {
    position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
  }
  .drop-icon { font-size: 26px; margin-bottom: 6px; }
  .drop-text { font-size: 13px; color: var(--text); }
  .drop-sub { font-size: 11px; color: var(--dim); margin-top: 4px; }

  #file-info {
    margin-top: 12px;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--accent);
    min-height: 16px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* Playback */
  .play-row {
    display: flex;
    gap: 10px;
    margin-top: 14px;
  }

  .btn {
    flex: 1;
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: #191919;
    color: var(--text);
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 0.05em;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.active { border-color: var(--accent2); color: var(--accent2); background: rgba(255,61,113,0.07); }
  .btn:disabled { opacity: 0.35; cursor: not-allowed; }

  /* Progress bar */
  #progress-wrap {
    margin-top: 12px;
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    cursor: pointer;
    position: relative;
  }
  #progress-bar {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    width: 0%;
    transition: width 0.1s linear;
    pointer-events: none;
  }

  /* Toggles */
  .toggle-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .toggle-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 12px;
    background: #171717;
    border: 1px solid var(--border);
    border-radius: 4px;
    cursor: pointer;
    transition: border-color 0.15s;
    user-select: none;
  }
  .toggle-item:hover { border-color: #333; }
  .toggle-item.on { border-color: rgba(0,229,255,0.3); background: rgba(0,229,255,0.04); }

  .toggle-name { font-size: 12px; color: var(--text); }
  .toggle-pip {
    width: 28px; height: 16px;
    border-radius: 8px;
    background: var(--off);
    position: relative;
    transition: background 0.2s;
    flex-shrink: 0;
  }
  .toggle-pip::after {
    content: '';
    position: absolute;
    width: 10px; height: 10px;
    border-radius: 50%;
    background: #555;
    top: 3px; left: 3px;
    transition: left 0.2s, background 0.2s;
  }
  .toggle-item.on .toggle-pip { background: rgba(0,229,255,0.25); }
  .toggle-item.on .toggle-pip::after { left: 15px; background: var(--accent); }

  /* Sliders */
  .slider-row {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .slider-item label {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--text);
    margin-bottom: 6px;
  }
  .slider-item label span {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--accent);
  }

  input[type=range] {
    -webkit-appearance: none;
    width: 100%;
    height: 3px;
    border-radius: 2px;
    background: var(--border);
    outline: none;
    cursor: pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid #000;
    cursor: pointer;
    transition: transform 0.1s;
  }
  input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.3); }

  /* Export panel */
  .export-grid {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  #export-status {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--dim);
    min-height: 16px;
  }

  .color-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 4px;
  }

  .color-swatch {
    width: 24px; height: 24px;
    border-radius: 50%;
    cursor: pointer;
    border: 2px solid transparent;
    transition: border-color 0.15s, transform 0.1s;
  }
  .color-swatch:hover { transform: scale(1.15); }
  .color-swatch.selected { border-color: #fff; }

  @media (max-width: 900px) {
    #canvas-wrap { width: 100%; }
    #controls { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">V<span>I</span>ZR</div>
  <div class="tagline">Audio Visualization Engine · 30fps Canvas</div>
</header>

<div id="canvas-wrap">
  <canvas id="viz" width="1280" height="720"></canvas>
  <div id="rec-pill"><div class="rec-dot"></div> REC</div>
</div>

<div id="controls">

  <!-- Panel 1: Source + Playback -->
  <div class="panel">
    <div class="panel-label">Source &amp; Playback</div>
    <div id="drop-zone">
      <input type="file" id="audioUpload" accept="audio/*">
      <div class="drop-icon">🎵</div>
      <div class="drop-text">Drop audio file or click</div>
      <div class="drop-sub">MP3, WAV, FLAC, OGG, AAC</div>
    </div>
    <div id="file-info">No file loaded</div>
    <div class="play-row">
      <button class="btn" id="playBtn" disabled>▶ PLAY</button>
      <button class="btn" id="stopBtn" disabled>■ STOP</button>
    </div>
    <div id="progress-wrap">
      <div id="progress-bar"></div>
    </div>
  </div>

  <!-- Panel 2: Layers + Params -->
  <div class="panel">
    <div class="panel-label">Layers</div>
    <div class="toggle-grid">
      <div class="toggle-item on" data-key="showBars">
        <span class="toggle-name">Freq Bars</span>
        <div class="toggle-pip"></div>
      </div>
      <div class="toggle-item on" data-key="showWave">
        <span class="toggle-name">Waveform</span>
        <div class="toggle-pip"></div>
      </div>
      <div class="toggle-item on" data-key="showParticles">
        <span class="toggle-name">Particles</span>
        <div class="toggle-pip"></div>
      </div>
      <div class="toggle-item on" data-key="useTrails">
        <span class="toggle-name">Trails</span>
        <div class="toggle-pip"></div>
      </div>
    </div>

    <div class="panel-label" style="margin-top:18px">Parameters</div>
    <div class="slider-row">
      <div class="slider-item">
        <label>Sensitivity <span id="sensVal">1.4</span></label>
        <input type="range" id="sensitivity" min="0.5" max="3" step="0.05" value="1.4">
      </div>
      <div class="slider-item">
        <label>Trail Decay <span id="trailVal">0.18</span></label>
        <input type="range" id="trailDecay" min="0.02" max="0.5" step="0.01" value="0.18">
      </div>
      <div class="slider-item">
        <label>Bar Count <span id="barVal">80</span></label>
        <input type="range" id="barCount" min="16" max="256" step="4" value="80">
      </div>
    </div>
  </div>

  <!-- Panel 3: Color + Export -->
  <div class="panel">
    <div class="panel-label">Color Theme</div>
    <div class="color-row" id="colorRow"></div>

    <div class="panel-label" style="margin-top:20px">Export to Video</div>
    <div class="export-grid">
      <button class="btn" id="recBtn" disabled>⏺ START RECORDING</button>
      <button class="btn" id="stopRecBtn" disabled>⏹ STOP &amp; DOWNLOAD</button>
      <div id="export-status">Load audio to begin</div>
    </div>
  </div>

</div>

<script>
// ─── State ──────────────────────────────────────────────────────────────────
const config = {
  showBars: true,
  showWave: true,
  showParticles: true,
  useTrails: true,
  sensitivity: 1.4,
  trailDecay: 0.18,
  barCount: 80,
  theme: 0,
};

const THEMES = [
  { bars: '#00e5ff', wave: '#ffffff', particles: '#00e5ff', bg: 'rgba(0,0,0,' },       // Cyan ice
  { bars: '#ff3d71', wave: '#ffb347', particles: '#ff3d71', bg: 'rgba(10,0,0,' },      // Neon sunset
  { bars: '#7fff7f', wave: '#aaffaa', particles: '#00ff88', bg: 'rgba(0,8,0,' },       // Matrix green
  { bars: '#bf80ff', wave: '#e0b0ff', particles: '#cc66ff', bg: 'rgba(5,0,12,' },      // Purple dusk
  { bars: '#ffdd00', wave: '#ffffff', particles: '#ffaa00', bg: 'rgba(8,6,0,' },       // Gold
  { bars: '#ff6ec7', wave: '#ff9ee5', particles: '#ff3fa4', bg: 'rgba(10,0,8,' },      // Pink
];
const SWATCHES = ['#00e5ff','#ff3d71','#7fff7f','#bf80ff','#ffdd00','#ff6ec7'];

// ─── Audio ───────────────────────────────────────────────────────────────────
let audioCtx, analyserNode, sourceNode, audioBuffer;
let isPlaying = false, startTime = 0, pauseOffset = 0;
const FFT_SIZE = 2048;

async function initAudio(file) {
  if (audioCtx) audioCtx.close();
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  analyserNode = audioCtx.createAnalyser();
  analyserNode.fftSize = FFT_SIZE;
  analyserNode.smoothingTimeConstant = 0.82;
  analyserNode.connect(audioCtx.destination);

  const arrayBuffer = await file.arrayBuffer();
  audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
  pauseOffset = 0;
  updateButtons(true);
  document.getElementById('export-status').textContent = 'Ready — press record before playing';
}

function playAudio(offset = 0) {
  if (!audioBuffer) return;
  if (sourceNode) { try { sourceNode.stop(); } catch(e){} }
  sourceNode = audioCtx.createBufferSource();
  sourceNode.buffer = audioBuffer;
  sourceNode.connect(analyserNode);
  sourceNode.start(0, offset);
  startTime = audioCtx.currentTime - offset;
  isPlaying = true;
  sourceNode.onended = () => {
    if (isPlaying) { isPlaying = false; pauseOffset = 0; updateButtons(true); }
  };
  updateButtons(true);
}

function stopAudio() {
  if (sourceNode) { try { sourceNode.stop(); } catch(e){} }
  isPlaying = false;
  pauseOffset = 0;
  updateButtons(true);
}

function updateButtons(loaded) {
  playBtn.disabled = !loaded;
  stopBtn.disabled = !loaded;
  recBtn.disabled = !loaded;
  playBtn.textContent = isPlaying ? '⏸ PAUSE' : '▶ PLAY';
}

// ─── Canvas ───────────────────────────────────────────────────────────────────
const canvas = document.getElementById('viz');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// Particles
const MAX_PARTICLES = 220;
let particles = [];

function spawnParticle(energy) {
  const angle = Math.random() * Math.PI * 2;
  const speed = 1.5 + energy * 5 * Math.random();
  particles.push({
    x: W / 2 + (Math.random() - 0.5) * W * 0.25,
    y: H / 2 + (Math.random() - 0.5) * H * 0.25,
    vx: Math.cos(angle) * speed,
    vy: Math.sin(angle) * speed,
    life: 1.0,
    decay: 0.008 + Math.random() * 0.018,
    size: 1.5 + Math.random() * 3 * energy,
  });
}

let lastBeatEnergy = 0;

function draw() {
  requestAnimationFrame(draw);

  const theme = THEMES[config.theme];
  const freqData = new Uint8Array(analyserNode ? analyserNode.frequencyBinCount : 128);
  const timeData = new Uint8Array(analyserNode ? analyserNode.fftSize : FFT_SIZE);
  if (analyserNode) {
    analyserNode.getByteFrequencyData(freqData);
    analyserNode.getByteTimeDomainData(timeData);
  }

  // Average energy (bass + low-mid)
  let energy = 0;
  const bassEnd = Math.floor(freqData.length * 0.12);
  for (let i = 0; i < bassEnd; i++) energy += freqData[i];
  energy = (energy / bassEnd) / 255;

  // Beat detection
  const isBeat = energy > 0.55 && energy > lastBeatEnergy * 1.15;
  lastBeatEnergy = lastBeatEnergy * 0.9 + energy * 0.1;

  // Background / trails
  if (config.useTrails) {
    ctx.fillStyle = theme.bg + config.trailDecay + ')';
    ctx.fillRect(0, 0, W, H);
  } else {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
  }

  // ── FREQ BARS ──
  if (config.showBars && analyserNode) {
    const count = config.barCount;
    const binStep = Math.floor(freqData.length / count);
    const barW = (W / count) * 0.75;
    const gap = (W / count) * 0.25;

    for (let i = 0; i < count; i++) {
      let sum = 0;
      for (let j = 0; j < binStep; j++) sum += freqData[i * binStep + j];
      const amp = (sum / binStep / 255) * config.sensitivity;
      const bh = amp * H * 0.72;
      const x = i * (W / count);

      // Gradient per bar
      const grad = ctx.createLinearGradient(0, H, 0, H - bh);
      grad.addColorStop(0, theme.bars + 'cc');
      grad.addColorStop(1, theme.bars + '22');
      ctx.fillStyle = grad;
      ctx.fillRect(x + gap / 2, H - bh, barW, bh);

      // Mirror (top, subtle)
      ctx.globalAlpha = 0.18;
      ctx.fillStyle = theme.bars;
      ctx.fillRect(x + gap / 2, 0, barW, bh * 0.2);
      ctx.globalAlpha = 1;
    }
  }

  // ── WAVEFORM ──
  if (config.showWave && analyserNode) {
    ctx.beginPath();
    ctx.strokeStyle = theme.wave;
    ctx.lineWidth = 1.5;
    ctx.globalAlpha = 0.75;
    const sliceW = W / timeData.length;
    let x = 0;
    for (let i = 0; i < timeData.length; i++) {
      const v = (timeData[i] / 128) - 1;
      const y = H / 2 + v * H * 0.22 * config.sensitivity;
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      x += sliceW;
    }
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // ── PARTICLES ──
  if (config.showParticles) {
    // Spawn on beats or continuous trickle
    if (isBeat && particles.length < MAX_PARTICLES) {
      for (let i = 0; i < 12; i++) spawnParticle(energy);
    } else if (isPlaying && Math.random() < 0.25 && particles.length < MAX_PARTICLES) {
      spawnParticle(energy * 0.4);
    }

    const pc = theme.particles;
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx; p.y += p.vy;
      p.vx *= 0.97; p.vy *= 0.97;
      p.life -= p.decay;
      if (p.life <= 0) { particles.splice(i, 1); continue; }

      ctx.globalAlpha = p.life * 0.85;
      ctx.fillStyle = pc;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // ── BEAT FLASH ──
  if (isBeat && isPlaying) {
    ctx.globalAlpha = 0.04 + energy * 0.08;
    ctx.fillStyle = theme.bars;
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
  }

  // ── Idle grid (no audio) ──
  if (!analyserNode) {
    ctx.strokeStyle = '#1a1a1a';
    ctx.lineWidth = 1;
    for (let x = 0; x < W; x += 80) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
    for (let y = 0; y < H; y += 80) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
    ctx.fillStyle = '#2a2a2a';
    ctx.font = "600 15px 'Space Mono', monospace";
    ctx.textAlign = 'center';
    ctx.fillText('DROP AN AUDIO FILE TO BEGIN', W / 2, H / 2);
  }

  // ── Progress ──
  if (audioBuffer && isPlaying) {
    const elapsed = audioCtx.currentTime - startTime;
    const pct = Math.min(elapsed / audioBuffer.duration, 1) * 100;
    document.getElementById('progress-bar').style.width = pct + '%';
  }
}

// ─── Recording ───────────────────────────────────────────────────────────────
let mediaRecorder = null, recordedChunks = [];

function startRecording() {
  recordedChunks = [];
  const stream = canvas.captureStream(30);

  // Mix in audio if available
  if (audioCtx) {
    const dest = audioCtx.createMediaStreamDestination();
    analyserNode.connect(dest);
    dest.stream.getAudioTracks().forEach(t => stream.addTrack(t));
  }

  const mime = MediaRecorder.isTypeSupported('video/webm;codecs=vp9')
    ? 'video/webm;codecs=vp9' : 'video/webm';
  mediaRecorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 8_000_000 });
  mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
  mediaRecorder.onstop = exportVideo;
  mediaRecorder.start(100);

  document.getElementById('rec-pill').classList.add('visible');
  document.getElementById('export-status').textContent = 'Recording… press Stop to save';
  recBtn.classList.add('active');
  stopRecBtn.disabled = false;
  recBtn.disabled = true;
}

function stopRecording() {
  if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
  document.getElementById('rec-pill').classList.remove('visible');
  recBtn.classList.remove('active');
  recBtn.disabled = false;
  stopRecBtn.disabled = true;
}

function exportVideo() {
  const blob = new Blob(recordedChunks, { type: 'video/webm' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'visualizer.webm';
  a.click();
  URL.revokeObjectURL(url);
  document.getElementById('export-status').textContent = 'Downloaded! Open in VLC or convert with HandBrake.';
}

// ─── UI wiring ───────────────────────────────────────────────────────────────
const playBtn = document.getElementById('playBtn');
const stopBtn = document.getElementById('stopBtn');
const recBtn  = document.getElementById('recBtn');
const stopRecBtn = document.getElementById('stopRecBtn');

playBtn.onclick = () => {
  if (!audioBuffer) return;
  if (isPlaying) {
    pauseOffset = audioCtx.currentTime - startTime;
    sourceNode.stop(); isPlaying = false;
    playBtn.textContent = '▶ PLAY';
  } else {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    playAudio(pauseOffset);
    playBtn.textContent = '⏸ PAUSE';
  }
};

stopBtn.onclick = () => { stopAudio(); document.getElementById('progress-bar').style.width = '0%'; };
recBtn.onclick = startRecording;
stopRecBtn.onclick = stopRecording;

// File upload
const fileInput = document.getElementById('audioUpload');
const dropZone  = document.getElementById('drop-zone');

fileInput.onchange = e => handleFile(e.target.files[0]);

dropZone.ondragover = e => { e.preventDefault(); dropZone.classList.add('drag-over'); };
dropZone.ondragleave = () => dropZone.classList.remove('drag-over');
dropZone.ondrop = e => {
  e.preventDefault();
  dropZone.classList.remove('drag-over');
  const f = e.dataTransfer.files[0];
  if (f && f.type.startsWith('audio/')) handleFile(f);
};

async function handleFile(file) {
  if (!file) return;
  document.getElementById('file-info').textContent = file.name;
  await initAudio(file);
}

// Toggles
document.querySelectorAll('.toggle-item').forEach(el => {
  el.onclick = () => {
    const key = el.dataset.key;
    config[key] = !config[key];
    el.classList.toggle('on', config[key]);
  };
});

// Sliders
const sensitivitySlider = document.getElementById('sensitivity');
sensitivitySlider.oninput = () => {
  config.sensitivity = parseFloat(sensitivitySlider.value);
  document.getElementById('sensVal').textContent = config.sensitivity.toFixed(2);
};

const trailSlider = document.getElementById('trailDecay');
trailSlider.oninput = () => {
  config.trailDecay = parseFloat(trailSlider.value);
  document.getElementById('trailVal').textContent = config.trailDecay.toFixed(2);
};

const barSlider = document.getElementById('barCount');
barSlider.oninput = () => {
  config.barCount = parseInt(barSlider.value);
  document.getElementById('barVal').textContent = config.barCount;
};

// Color swatches
const colorRow = document.getElementById('colorRow');
SWATCHES.forEach((hex, i) => {
  const sw = document.createElement('div');
  sw.className = 'color-swatch' + (i === 0 ? ' selected' : '');
  sw.style.background = hex;
  sw.title = ['Cyan Ice','Neon Sunset','Matrix Green','Purple Dusk','Gold','Pink'][i];
  sw.onclick = () => {
    document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('selected'));
    sw.classList.add('selected');
    config.theme = i;
  };
  colorRow.appendChild(sw);
});

// Progress bar seek
document.getElementById('progress-wrap').onclick = e => {
  if (!audioBuffer) return;
  const rect = e.currentTarget.getBoundingClientRect();
  const pct = (e.clientX - rect.left) / rect.width;
  const seekTo = pct * audioBuffer.duration;
  pauseOffset = seekTo;
  if (isPlaying) playAudio(seekTo);
};

// Kick off render loop
draw();
</script>
</body>
</html>
