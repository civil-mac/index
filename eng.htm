<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.E. Calc Book | Engineering Analysis Modules</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-blue: #38bdf8;
            --accent-wood: #fbbf24;
            --accent-steel: #94a3b8;
            --accent-concrete: #cbd5e1;
            --accent-masonry: #f87171;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 1.5rem;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Header Layout */
        header {
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1.5rem;
        }

        header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.05em;
            color: var(--text-main);
            margin-bottom: 0.25rem;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* Section Markers styling used for both Section Titles and Material Label */
        .section-label {
            font-size: 1.1rem;
            color: var(--text-muted);
            margin-bottom: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 600;
        }

        .section-title {
            font-size: 1.5rem;
            margin-bottom: 1.25rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 700;
        }

        /* Material Tier Selector (Row 1) */
        .material-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 0.75rem;
            margin-bottom: 2.5rem;
        }

        .mat-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 1rem;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.2s ease;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
        }

        .mat-btn:hover {
            transform: translateY(-2px);
            border-color: var(--accent-blue);
        }

        .mat-btn.active[data-mat="wood"] { border-color: var(--accent-wood); box-shadow: 0 0 12px rgba(251, 191, 36, 0.2); }
        .mat-btn.active[data-mat="steel"] { border-color: var(--accent-steel); box-shadow: 0 0 12px rgba(148, 163, 184, 0.2); }
        .mat-btn.active[data-mat="concrete"] { border-color: var(--accent-concrete); box-shadow: 0 0 12px rgba(203, 213, 225, 0.2); }
        .mat-btn.active[data-mat="masonry"] { border-color: var(--accent-masonry); box-shadow: 0 0 12px rgba(248, 113, 113, 0.2); }
        .mat-btn.active[data-mat="composite"] { border-color: var(--accent-blue); box-shadow: 0 0 12px rgba(56, 189, 248, 0.2); }

        /* Dynamic Module Grid (Row 2) */
        .module-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 1.25rem;
        }

        /* Bento-Box Card Styling */
        .module-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 180px;
            text-decoration: none;
            color: inherit;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .module-card:hover {
            transform: scale(1.02);
            border-color: var(--accent-blue);
            background: #243146;
        }

        .module-graphic {
            width: 100%;
            height: 75px;
            background: #111827;
            border-radius: 8px;
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #475569;
            font-size: 0.8rem;
            border: 1px dashed #334155;
        }

        .module-info h3 {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.35rem;
        }

        .module-info p {
            font-size: 0.8rem;
            color: var(--text-muted);
            line-height: 1.4;
        }

        .status-badge {
            position: absolute;
            top: 0.5rem;
            right: 0.5rem;
            font-size: 0.65rem;
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            background: #292524;
            color: #a8a29e;
            border: 1px solid #44403c;
            font-weight: 600;
        }

        .status-badge.ready {
            background: #064e3b;
            color: #34d399;
            border: 1px solid #047857;
        }

        /* Mobile Adjustments */
        @media (max-width: 480px) {
            body { padding: 1rem; }
            .material-row { grid-template-columns: repeat(3, 1fr); }
            .material-row .mat-btn:nth-child(4), 
            .material-row .mat-btn:nth-child(5) { grid-column: span 1; }
            .module-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Structural Calc Book</h1>
        <p>Interactive verification modules & reference standards</p>
    </header>

    <div class="section-label">Material:</div>

    <div class="material-row">
        <button class="mat-btn" data-mat="wood">🪵 Wood</button>
        <button class="mat-btn" data-mat="steel">🦾 Steel</button>
        <button class="mat-btn" data-mat="concrete">🪨 Concrete</button>
        <button class="mat-btn" data-mat="masonry">🧱 Masonry</button>
        <button class="mat-btn" data-mat="composite">⚡ Composite</button>
    </div>

    <h2 class="section-title" id="active-title" style="color: var(--text-muted);">Select a Material</h2>
    <div class="module-grid" id="module-container">
        </div>
</div>

<script>
    const moduleDatabase = {
        wood: [
            { title: "Beam Analysis", desc: "Flexure, shear...", badge: "Ready", link: "wood/beam.htm" },
            { title: "Compression", desc: "Solid column...", badge: "Placeholder", link: "wood/beam.htm" },
            { title: "Tension Members", desc: "Tension parallel-to-grain capacity checks factoring net section cuts.", badge: "Placeholder", link: "#" },
            { title: "Combined Stresses", desc: "Multi-axis bending interacting with axial tension or compression forces.", badge: "Placeholder", link: "#" },
            { title: "Connection Design", desc: "Tested light-gauge hardware parameters, dowel bolts, screws, and nails.", badge: "Placeholder", link: "#" }
        ],
        steel: [
            { title: "Beam Analysis", desc: "Flexure capacity...", badge: "Placeholder", link: "wood/beam.htm" },
            { title: "Compression", desc: "Column axial design evaluating elastic, inelastic, torsional, and flexural buckling limit states.", badge: "Placeholder", link: "#" },
            { title: "Tension Members", desc: "Yielding on gross section vs. rupture on net effective section calculations.", badge: "Placeholder", link: "#" },
            { title: "Combined Stresses", desc: "AISC Chapter H interaction limits for axial compression paired with bending forces.", badge: "Placeholder", link: "#" },
            { title: "Connection Design", desc: "Weld design, single bolt/bolt groups, and plate design for block shear, local bending, and bearing.", badge: "Placeholder", link: "#" }
        ],
        concrete: [
            { title: "Beam Analysis", desc: "Bending reinforcement capacity checks, concrete shear limits, and deflection calculations.", badge: "Placeholder", link: "#" },
            { title: "Compression", desc: "Tied or spiral column axial compression capacity including buckling checks.", badge: "Placeholder", link: "#" },
            { title: "Combined Stresses", desc: "P-M interaction tracking paths matching ACI flexure-axial load boundaries.", badge: "Placeholder", link: "#" },
            { title: "Connection Design", desc: "Anchor pullout, pryout, side shear, rebar development length, and anchor bolt groups.", badge: "Placeholder", link: "#" }
        ],
        masonry: [
            { title: "Beam Analysis", desc: "Reinforced masonry lintel capacity checks covering flexure, shear, and deflection rules.", badge: "Placeholder", link: "#" },
            { title: "Compression", desc: "Axial wall or pilaster bearing constraints and slender column buckling equations.", badge: "Placeholder", link: "#" },
            { title: "Combined Stresses", desc: "TMS 402 out-of-plane masonry section interaction under combined axial and lateral wind/seismic loads.", badge: "Placeholder", link: "#" },
            { title: "Connection Design", desc: "Anchor bolt pullout, edge breakout, shear loops, and reinforcement development in grouted cells.", badge: "Placeholder", link: "#" }
        ],
        composite: [] 
    };

    const colorMap = {
        wood: "var(--accent-wood)",
        steel: "var(--accent-steel)",
        concrete: "var(--accent-concrete)",
        masonry: "var(--accent-masonry)",
        composite: "var(--accent-blue)"
    };

    const container = document.getElementById('module-container');
    const activeTitle = document.getElementById('active-title');
    const buttons = document.querySelectorAll('.mat-btn');

    function renderModules(material) {
        container.innerHTML = '';
        
        activeTitle.innerText = material.charAt(0).toUpperCase() + material.slice(1);
        activeTitle.style.color = colorMap[material];

        const modules = moduleDatabase[material];

        if (modules.length === 0) {
            container.innerHTML = `
                <div style="grid-column: 1 / -1; color: var(--text-muted); font-size: 0.9rem; font-style: italic; padding: 2rem 0;">
                    No modules loaded yet. Framework pipeline ready for expansion.
                </div>`;
            return;
        }

        modules.forEach(mod => {
            const card = document.createElement('a');
            card.className = 'module-card';
            card.href = mod.link;

            const badgeClass = mod.badge === 'Ready' ? 'status-badge ready' : 'status-badge';

            card.innerHTML = `
                <div class="status-badge ${badgeClass}">${mod.badge}</div>
                <div class="module-graphic">
                    📐 [Graphic Frame]
                </div>
                <div class="module-info">
                    <h3>${mod.title}</h3>
                    <p>${mod.desc}</p>
                </div>
            `;
            container.appendChild(card);
        });
    }

    // Set up default initial screen state (Empty Welcome Mode)
    function initWelcomeState() {
        container.innerHTML = `
            <div style="grid-column: 1 / -1; color: var(--text-muted); font-size: 0.95rem; font-style: italic; padding: 3rem 0; text-align: center; border: 1px dashed var(--border-color); border-radius: 16px;">
                Please select a construction material above to view specialized verification tools.
            </div>`;
    }

    buttons.forEach(btn => {
        btn.addEventListener('click', () => {
            buttons.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderModules(btn.getAttribute('data-mat'));
        });
    });

    // Execute empty dashboard loop on page paint
    initWelcomeState();
</script>

</body>
</html>
