<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Private Arcade Launcher</title>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: sans-serif; }
    #canvas-container { width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
    canvas { max-width: 100%; max-height: 100%; object-fit: contain; image-rendering: pixelated; }
  </style>
</head>
<body>

  <div id="canvas-container">
    <canvas id="player-canvas"></canvas>
  </div>

  <!-- Imports Nostalgist from the global unpkg CDN network -->
  <script type="importmap">
    {
      "imports": {
        "nostalgist": "https://cdn.jsdelivr.net/npm/nostalgist/+esm"
      }
    }
  </script>

  <script type="module">
    import { Nostalgist } from 'nostalgist';

    async function bootEmulator() {
      try {
        await Nostalgist.launch({
          element: document.getElementById('player-canvas'),
          core: 'snes9x', 
          // Points directly to your curated folder path below. Change file name to match yours!
          rom: './assets/roms/snes/super_mario_world.sfc', 
        });
      } catch (err) {
        console.error("The emulator engine failed to initialize:", err);
      }
    }

    window.addEventListener('DOMContentLoaded', bootEmulator);
  </script>
</body>
</html>
