<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Private Arcade Launcher</title>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: sans-serif; }
    #canvas-container { width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
    canvas { max-width: 100%; max-height: 100%; object-fit: contain; image-rendering: pixelated; }
  </style>
</head>
<body>

  <div id="canvas-container">
    <!-- The emulator will render Link here -->
    <canvas id="player-canvas"></canvas>
  </div>

  <!-- Imports Nostalgist from the global unpkg CDN network -->
  <script type="importmap">
    {
      "imports": {
        "nostalgist": "https://cdn.jsdelivr.net/npm/nostalgist/+esm"
      }
    }
  </script>

  <!-- Only ONE single application script block is needed -->
  <script type="module">
    import { Nostalgist } from 'nostalgist';

    async function bootEmulator() {
      try {
        await Nostalgist.launch({
          element: document.getElementById('player-canvas'),
          core: 'snes9x', 
          
          // Your exact game file location
          rom: './assets/roms/snes/A_Link_to_the_Past.smc',
          
          // RetroArch configurations for custom keyboard keys
          retroarchConfig: {
            // Player 1 Movement mapped to WASD
            input_player1_up: 'w',
            input_player1_down: 's',
            input_player1_left: 'a',
            input_player1_right: 'd',
            
            // Action buttons mapped to keys that feel like an emulator app
            input_player1_a: 'k',       // Link's sword swing
            input_player1_b: 'j',       // Run / Cancel / Talk
            input_player1_x: 'i',       // Use secondary item (Bow, Boomerang, etc.)
            input_player1_y: 'u',       // Secondary button alternative
            
            // Menu buttons
            input_player1_start: 'space',  // Opens Inventory/Map screen
            input_player1_select: 'shift', // Save/Quit menu
            
            // Shoulder buttons (useful for swapping item sub-screens or fast mapping later)
            input_player1_l: 'q',
            input_player1_r: 'e'
          }
        });
      } catch (err) {
        console.error("The emulator engine failed to initialize:", err);
      }
    }

    // Keep the listener down here so the game runs automatically as soon as the page loads
    window.addEventListener('DOMContentLoaded', bootEmulator);
  </script>
</body>
</html>
