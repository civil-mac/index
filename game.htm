<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Private Retro Arcade</title>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
    #canvas-container { width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
    canvas { max-width: 100%; max-height: 100%; object-fit: contain; }
  </style>
</head>
<body>

  <div id="canvas-container">
    <!-- The WebAssembly emulator will inject the game screen right here -->
    <canvas id="canvas"></canvas>
  </div>

  <!-- Load Nostalgist from a public CDN -->
  <script type="importmap">
    {
      "imports": {
        "nostalgist": "https://cdn.jsdelivr.net/npm/nostalgist/+esm"
      }
    }
  </script>

  <script type="module">
    import { Nostalgist } from 'nostalgist';

    async function launchGame() {
      try {
        await Nostalgist.launch({
          element: document.getElementById('canvas'),
          core: 'snes9x', // Tells it to fetch the SNES engine
          // Path to your ROM file inside your GitHub repo
          rom: './roms/snes/super_mario_world.sfc', 
        });
      } catch (error) {
        console.error("Emulator failed to boot:", error);
      }
    }

    // Run the emulator as soon as the page loads
    window.addEventListener('DOMContentLoaded', launchGame);
  </script>
</body>
</html>
