<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Private Arcade Launcher - PS1</title>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: sans-serif; }
    #canvas-container { width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
    canvas { width: 100vw !important; height: 100vh !important; object-fit: contain !important; image-rendering: pixelated; }
  </style>
</head>
<body>

  <div id="canvas-container">
    <canvas id="player-canvas"></canvas>
  </div>

  <!-- Imports Nostalgist from the global unpkg CDN network -->
  <script type="importmap">
    {
      "imports": {
        "nostalgist": "https://cdn.jsdelivr.net/npm/nostalgist/+esm"
      }
    }
  </script>

  <script type="module">
    import { Nostalgist } from 'nostalgist';

    async function bootEmulator() {
      try {
        await Nostalgist.launch({
          element: document.getElementById('player-canvas'),
          core: 'pcsx_rearmed', 
          
          // Points directly to the file sitting in the same main repository folder
rom: 'https://github.com/civil-mac/index/releases/download/v1.0.0/Tekken_3.bin',
          
          // The mandatory PlayStation system boot file
          bios: [
            './scph1001.bin'
          ],
          
          // RetroArch configurations mapped clean for 3D fighting layout
          retroarchConfig: {
            // Player 1 Movement (D-Pad) mapped to WASD
            input_player1_up: 'w',
            input_player1_down: 's',
            input_player1_left: 'a',
            input_player1_right: 'd',
            
            // PS1 Face Buttons
            input_player1_b: 'j',       // X Button (Left Kick)
            input_player1_a: 'k',       // Circle Button (Right Kick)
            input_player1_y: 'u',       // Square Button (Left Punch)
            input_player1_x: 'i',       // Triangle Button (Right Punch)
            
            // Menu elements
            input_player1_start: 'space',  // Start button
            input_player1_select: 'shift', // Select button
            
            // Shoulder Triggers
            input_player1_l: 'l',       // L1 Trigger
            input_player1_r: 'o',       // R1 Trigger
            input_player1_l2: 'q',      // L2 Trigger
            input_player1_r2: 'e'       // R2 Trigger
          }
        });
      } catch (err) {
        console.error("The emulator engine failed to initialize:", err);
      }
    }

    window.addEventListener('DOMContentLoaded', bootEmulator);
  </script>
</body>
</html>
