<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Private Arcade Launcher - PS1</title>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
    #canvas-container { width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; position: relative; }
    canvas { max-width: 100%; max-height: 100%; width: auto; height: auto; object-fit: contain; image-rendering: pixelated; }
    #loading-screen {
      position: absolute; inset: 0; z-index: 2;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #000;
      text-align: center; color: #fff; font-family: sans-serif;
    }
    #loading-screen-inner { max-width: 400px; width: 80%; }
    .progress-container { width: 100%; background: #222; height: 20px; border-radius: 10px; overflow: hidden; margin: 15px 0; position: relative; }
    .progress-bar {
      position: absolute; top: 0; left: 0; width: 40%; height: 100%;
      background: #00ff66; border-radius: 10px;
      animation: indeterminate 1.3s ease-in-out infinite;
    }
    @keyframes indeterminate {
      0%   { left: -40%; }
      100% { left: 100%; }
    }
    #status-text { font-size: 14px; color: #aaa; }
  </style>
</head>
<body>
  <div id="canvas-container">
    <div id="loading-screen">
      <div id="loading-screen-inner">
        <h2 style="font-weight: 400;">Loading Game Data</h2>
        <div class="progress-container"><div class="progress-bar"></div></div>
        <div id="status-text">Starting core, BIOS, and game...</div>
      </div>
    </div>
    <canvas id="player-canvas"></canvas>
  </div>

  <script type="importmap">
    { "imports": { "nostalgist": "https://cdn.jsdelivr.net/npm/nostalgist/+esm" } }
  </script>

  <script type="module">
    import { Nostalgist } from 'nostalgist';

    const ROM_URL = 'https://raw.githubusercontent.com/civil-mac/index/main/Tekken_3.bin';
    const BIOS_URL = 'https://raw.githubusercontent.com/civil-mac/index/main/scph1001.bin';

    const statusText = document.getElementById('status-text');

    async function init() {
      try {
        await Nostalgist.launch({
          element: document.getElementById('player-canvas'),
          core: 'pcsx_rearmed',
          // Plain https:// URLs let Nostalgist fetch AND auto-load the
          // content itself - this is the code path all of its documented
          // examples use. The {fileName, fileContent} object form we tried
          // before does write the file into the virtual filesystem, but it
          // does not reliably set the "auto-launch this content" argument,
          // which is why RetroArch fell back to its manual file browser
          // instead of booting straight into the game.
          bios: BIOS_URL,
          rom: ROM_URL,
          // Core-specific options belong in retroarchCoreConfig, not
          // retroarchConfig - this was misplaced in the previous version.
          retroarchCoreConfig: {
            pcsx_rearmed_show_bios_bootlogo: 'disabled'
          },
          onLaunch() {
            // Only touch the loading-screen overlay here, never the canvas
            // itself - Nostalgist/Emscripten can swap out the actual canvas
            // node during startup, which is why re-querying #player-canvas
            // after launch returned null and threw.
            document.getElementById('loading-screen').style.display = 'none';
          }
        });
      } catch (err) {
        console.error(err);
        statusText.innerText = 'Launch failed: ' + err.message;
        alert("Launch Failed: " + err.message);
      }
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
