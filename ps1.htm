<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Private Arcade Launcher - PS1</title>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: sans-serif; }
    #canvas-container { width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
    canvas { width: 100vw !important; height: 100vh !important; object-fit: contain !important; image-rendering: pixelated; }
  </style>
</head>
<body>

  <div id="canvas-container">
    <canvas id="player-canvas"></canvas>
  </div>

  <script type="importmap">
    {
      "imports": {
        "nostalgist": "https://cdn.jsdelivr.net/npm/nostalgist/+esm"
      }
    }
  </script>

  <script type="module">
    import { Nostalgist } from 'nostalgist';

    async function bootEmulator() {
      try {
        await Nostalgist.launch({
          element: document.getElementById('player-canvas'),
          core: 'pcsx_rearmed', 
          
          // Streams your heavy game file via a CORS-friendly production CDN pipeline
          rom: 'https://libs.statically.io/gh/civil-mac/index/main/Tekken_3.bin',
          
          // Loads the raw local bios asset from your root repository folder
          bios: [
            './scph1001.bin'
          ],
          
          retroarchConfig: {
            input_player1_up: 'w',
            input_player1_down: 's',
            input_player1_left: 'a',
            input_player1_right: 'd',
            
            input_player1_b: 'j',       // X Button
            input_player1_a: 'k',       // Circle Button
            input_player1_y: 'u',       // Square Button
            input_player1_x: 'i',       // Triangle Button
            
            input_player1_start: 'space',
            input_player1_select: 'shift',
            
            input_player1_l: 'l',       // L1
            input_player1_r: 'o',       // R1
            input_player1_l2: 'q',      // L2
            input_player1_r2: 'e'       // R2
          }
        });
      } catch (err) {
        console.error("The emulator engine failed to initialize:", err);
      }
    }

    window.addEventListener('DOMContentLoaded', bootEmulator);
  </script>
</body>
</html>
