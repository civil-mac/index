<!DOCTYPE html>
<html>
<body style="font-family: sans-serif; padding: 20px;">
    <h2>Heatmap Data Extractor</h2>
    <p>Paste the full "d" string here (letters will be stripped automatically):</p>
    <textarea id="dInput" style="width:100%; height:100px;"></textarea>
    
    <p>Stream Duration (seconds):</p>
    <input type="number" id="vLen" value="14444" style="padding: 5px;">
    
    <br><br>
    <button onclick="process()" style="padding: 15px 30px; font-weight: bold; background: #007bff; color: white; border: none; cursor: pointer;">Download Sorted CSV</button>

    <script>
    function process() {
        let input = document.getElementById('dInput').value;
        let vLen = parseInt(document.getElementById('vLen').value);
        
        // This regex replaces any character that is NOT a number, dot, or minus sign with a space
        // This effectively deletes all M, C, L, and commas in one go.
        let clean = input.replace(/[^0-9.-]+/g, ' ');
        let nums = clean.trim().split(/\s+/).map(Number);
        
        let data = [];
        for (let i = 0; i < nums.length; i += 2) {
            let x = nums[i];
            let y = nums[i+1];
            if (x === undefined || y === undefined) continue;
            
            let time = (x / 1000) * vLen;
            let intensity = 100 - y; 
            data.push({time: time.toFixed(2), intensity: intensity.toFixed(2)});
        }
        
        // Sort by Intensity (highest first)
        data.sort((a, b) => b.intensity - a.intensity);
        
        let csv = "Timestamp (sec),Intensity\n";
        data.forEach(row => csv += row.time + "," + row.intensity + "\n");
        
        let blob = new Blob([csv], {type: 'text/csv'});
        let link = document.createElement('a');
        link.href = window.URL.createObjectURL(blob);
        link.download = "sorted_heatmap.csv";
        link.click();
    }
    </script>
</body>
</html>
