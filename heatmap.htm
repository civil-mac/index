<!DOCTYPE html>
<html>
<body style="font-family: sans-serif; padding: 20px;">
    <h2>Heatmap Data Extractor</h2>
    <p>Search for "heat-map" in the console "elements" tab, and copy the defs line under "svg"<br>
        Paste the full "d" string here:</p>
    <textarea id="dInput" style="width:100%; height:80px;"></textarea>
    
    <p>Stream Duration (seconds):</p>
    <input type="number" id="vLen" value="14444" style="padding: 5px;">
    
    <br><br>
    <button onclick="process()" style="padding: 15px 30px; font-weight: bold; background: #28a745; color: white; border: none; cursor: pointer;">Download Sorted CSV</button>

    <script>
    function process() {
        let input = document.getElementById('dInput').value;
        let vLen = parseInt(document.getElementById('vLen').value);
        let clean = input.replace(/[^0-9.-]+/g, ' ');
        let nums = clean.trim().split(/\s+/).map(Number);
        
        function formatTime(totalSeconds) {
            let h = Math.floor(totalSeconds / 3600);
            let m = Math.floor((totalSeconds % 3600) / 60);
            let s = Math.floor(totalSeconds % 60);
            return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }
        
        let data = [];
        for (let i = 0; i < nums.length; i += 2) {
            let x = nums[i];
            let y = nums[i+1];
            if (x === undefined || y === undefined) continue;
            
            let timeSec = (x / 1000) * vLen;
            let intensity = 100 - y;
            data.push({time: formatTime(timeSec), intensity: intensity.toFixed(2)});
        }
        
        data.sort((a, b) => b.intensity - a.intensity);
        
        let csv = "Timestamp (HH:MM:SS),Intensity\n";
        data.forEach(row => csv += row.time + "," + row.intensity + "\n");
        
        let blob = new Blob([csv], {type: 'text/csv'});
        let link = document.createElement('a');
        link.href = window.URL.createObjectURL(blob);
        link.download = "sorted_heatmap.csv";
        link.click();
    }
    </script>
</body>
</html>
