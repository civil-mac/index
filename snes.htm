<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Private Arcade Launcher</title>
HTML
<style>
  /* Base reset to ensure full viewport usage */
  body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
  
  /* Forceful canvas display for emulator stability */
  canvas { 
    display: block !important; 
    width: 100vw !important; 
    height: 100vh !important; 
    background: #000; 
    object-fit: contain;
  }
  
  #menu-screen {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: #000080;
    display: flex; justify-content: center; align-items: center;
    z-index: 100;
  }

  .zsnes-window {
    width: 640px; height: 480px;
    background: #000080;
    border: 4px solid #808080;
    display: flex; flex-direction: column;
    padding: 10px;
    box-sizing: border-box;
  }

  .nav-bar { display: flex; gap: 5px; margin-bottom: 10px; }
  .nav-btn { background: #808080; color: #fff; padding: 2px 10px; border: 2px outset #fff; font-family: monospace; font-weight: bold; }

  .main-area { flex: 1; display: flex; gap: 10px; }
  .file-list { 
    flex: 2; background: #000; border: 2px inset #fff; 
    color: #00ff00; font-family: monospace; padding: 10px;
    font-size: 18px; line-height: 1.4;
  }

  .game-link { 
    display: block; color: #00ff00; text-decoration: none; 
    cursor: pointer; padding: 2px;
  }
  .game-link:hover { background: #ff00ff; color: #fff; }
</style>

<div id="menu-screen">
  <div class="zsnes-window">
    <div class="nav-bar">
      <div class="nav-btn">GAME</div><div class="nav-btn">CONFIG</div><div class="nav-btn">CHEAT</div>
    </div>
    <div class="main-area">
      <div class="file-list">
        <div>LOAD GAME</div>
        <hr>
        <a class="game-link" onclick="startEmulator('./A_Link_to_the_Past.smc')">A_LINK_TO_THE_PAST.SMC</a>
        <a class="game-link" onclick="startEmulator('./Killer_Instinct.smc')">KILLER_INSTINCT.SMC</a>
      </div>
      <div class="file-list" style="flex: 1;">DIRECTORY</div>
    </div>
  </div></div>

  <script type="importmap">
    { "imports": { "nostalgist": "https://cdn.jsdelivr.net/npm/nostalgist/+esm" } }
  </script>

<script type="module">
    import { Nostalgist } from 'nostalgist';

    window.startEmulator = async function(romUrl) {
      // 1. Hide the menu
      document.getElementById('menu-screen').style.display = 'none';
      document.getElementById('player-canvas').style.display = 'block';

      // 2. Clean up any existing emulator instances
      try {
        await Nostalgist.reset(); 
      } catch (e) {
        console.warn("No previous instance to reset.");
      }

      // 3. Launch the new game
      try {
        await Nostalgist.launch({
          element: document.getElementById('player-canvas'),
          core: 'snes9x',
          rom: romUrl,
          retroarchConfig: {
            input_player1_up: 'w',
            input_player1_down: 's',
            input_player1_left: 'a',
            input_player1_right: 'd',
            input_player1_a: 'k',
            input_player1_b: 'j',
            input_player1_x: 'i',
            input_player1_y: 'u',
            input_player1_start: 'space',
            input_player1_select: 'shift',
            input_player1_l: 'l',
            input_player1_r: 'o'
          }
        });
      } catch (err) {
        console.error("Initialization failed:", err);
        alert("Launch failed. Check console for details.");
      }
    };
  </script>
</body>
</html>
