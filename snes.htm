<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Private Arcade Launcher</title>
<style>
  /* Retro CRT Overlay Effect */
  body::before {
    content: " ";
    display: block;
    position: absolute;
    top: 0; left: 0; bottom: 0; right: 0;
    background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
    z-index: 101; background-size: 100% 4px, 3px 100%; pointer-events: none;
  }

  #menu-screen { 
    position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
    background: #0d0d0d; display: flex; flex-direction: column; 
    justify-content: center; align-items: center; z-index: 100; color: #00ff66;
    font-family: 'Courier New', Courier, monospace; text-shadow: 0 0 5px #00ff66;
  }

  h1 { font-size: 3rem; margin-bottom: 40px; border-bottom: 4px solid #00ff66; }

  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; width: 80%; }

  .game-btn { 
    padding: 20px; font-size: 1.2rem; cursor: pointer; 
    background: #1a1a1a; border: 4px solid #00ff66; 
    color: #00ff66; font-weight: bold; text-transform: uppercase;
  }
  .game-btn:hover { background: #00ff66; color: #000; }
  
  /* Update your canvas CSS to be more forceful */
canvas { 
  display: block !important; 
  width: 100vw !important; 
  height: 100vh !important; 
  background: #000;
}
</style>

<div id="menu-screen">
  <h1>SELECT SYSTEM</h1>
  <div class="grid">
    <button class="game-btn" onclick="startEmulator('./A_Link_to_the_Past.smc')">Link to the Past</button>
    <button class="game-btn" onclick="startEmulator('./Killer_Instinct.smc')">Killer Instinct</button>
    <!-- Add more buttons here as you grow your repo -->
  </div>
</div>

  <script type="importmap">
    { "imports": { "nostalgist": "https://cdn.jsdelivr.net/npm/nostalgist/+esm" } }
  </script>

<script type="module">
    import { Nostalgist } from 'nostalgist';

    window.startEmulator = async function(romUrl) {
      // 1. Hide the menu
      document.getElementById('menu-screen').style.display = 'none';
      document.getElementById('player-canvas').style.display = 'block';

      // 2. Clean up any existing emulator instances
      try {
        await Nostalgist.reset(); 
      } catch (e) {
        console.warn("No previous instance to reset.");
      }

      // 3. Launch the new game
      try {
        await Nostalgist.launch({
          element: document.getElementById('player-canvas'),
          core: 'snes9x',
          rom: romUrl,
          retroarchConfig: {
            input_player1_up: 'w',
            input_player1_down: 's',
            input_player1_left: 'a',
            input_player1_right: 'd',
            input_player1_a: 'k',
            input_player1_b: 'j',
            input_player1_x: 'i',
            input_player1_y: 'u',
            input_player1_start: 'space',
            input_player1_select: 'shift',
            input_player1_l: 'l',
            input_player1_r: 'o'
          }
        });
      } catch (err) {
        console.error("Initialization failed:", err);
        alert("Launch failed. Check console for details.");
      }
    };
  </script>
</body>
</html>
