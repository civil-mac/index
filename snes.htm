<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Private Arcade Launcher</title>
<style>
  #menu-screen { 
    position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
    background: #000080; /* The classic ZSNES deep blue */
    display: flex; flex-direction: column; justify-content: center; align-items: center; 
    z-index: 100; color: #fff; font-family: 'Arial', sans-serif;
  }

  /* The "Window" container */
  .zsnes-window {
    background: #c0c0c0; /* Classic grey */
    border: 3px outset #fff;
    padding: 2px;
    width: 600px;
    box-shadow: 10px 10px 0px rgba(0,0,0,0.5);
  }

  .window-header {
    background: #000080;
    color: #fff;
    padding: 5px 10px;
    font-weight: bold;
    font-size: 14px;
    margin-bottom: 10px;
  }

  .game-btn { 
    display: block; width: 95%; margin: 5px auto;
    padding: 10px; font-size: 16px; cursor: pointer; 
    background: #e0e0e0; border: 2px outset #fff;
    text-align: left; color: #000;
  }
  .game-btn:hover { background: #d0d0d0; border-style: inset; }
canvas { 
  display: block !important; 
  width: 100vw !important; 
  height: 100vh !important; 
  background: #000;
}
</style>

<div id="menu-screen">
  <div class="zsnes-window">
    <div class="window-header">FILE SELECTOR</div>
    <button class="game-btn" onclick="startEmulator('./A_Link_to_the_Past.smc')">LOZ: A Link to the Past</button>
    <button class="game-btn" onclick="startEmulator('./Killer_Instinct.smc')">Killer Instinct</button>
  </div>
</div>

  <script type="importmap">
    { "imports": { "nostalgist": "https://cdn.jsdelivr.net/npm/nostalgist/+esm" } }
  </script>

<script type="module">
    import { Nostalgist } from 'nostalgist';

    window.startEmulator = async function(romUrl) {
      // 1. Hide the menu
      document.getElementById('menu-screen').style.display = 'none';
      document.getElementById('player-canvas').style.display = 'block';

      // 2. Clean up any existing emulator instances
      try {
        await Nostalgist.reset(); 
      } catch (e) {
        console.warn("No previous instance to reset.");
      }

      // 3. Launch the new game
      try {
        await Nostalgist.launch({
          element: document.getElementById('player-canvas'),
          core: 'snes9x',
          rom: romUrl,
          retroarchConfig: {
            input_player1_up: 'w',
            input_player1_down: 's',
            input_player1_left: 'a',
            input_player1_right: 'd',
            input_player1_a: 'k',
            input_player1_b: 'j',
            input_player1_x: 'i',
            input_player1_y: 'u',
            input_player1_start: 'space',
            input_player1_select: 'shift',
            input_player1_l: 'l',
            input_player1_r: 'o'
          }
        });
      } catch (err) {
        console.error("Initialization failed:", err);
        alert("Launch failed. Check console for details.");
      }
    };
  </script>
</body>
</html>
