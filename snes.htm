<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Arcade</title>
  <style>
    body { margin: 0; background: #000; color: #fff; font-family: sans-serif; }
    #menu { padding: 20px; }
    .game-btn { 
      display: block; margin: 10px 0; padding: 15px; 
      background: #333; color: #fff; border: 1px solid #fff; cursor: pointer; 
    }
    #player-canvas { width: 100vw; height: 100vh; display: none; }
  </style>
</head>
<body>

  <div id="menu">
    <h1>Game Select</h1>
    <button class="game-btn" onclick="launch('./A_Link_to_the_Past.smc')">Link to the Past</button>
    <button class="game-btn" onclick="launch('./Killer_Instinct.smc')">Killer Instinct</button>
  </div>

  <canvas id="player-canvas"></canvas>

  <script type="importmap">
    { "imports": { "nostalgist": "https://cdn.jsdelivr.net/npm/nostalgist/+esm" } }
  </script>

  <script type="module">
    import { Nostalgist } from 'nostalgist';

    window.launch = async function(url) {
      document.getElementById('menu').style.display = 'none';
      document.getElementById('player-canvas').style.display = 'block';
      
      try {
        await Nostalgist.launch({
          element: document.getElementById('player-canvas'),
          core: 'snes9x',
          rom: url
        });
      } catch (e) {
        alert("Launch error: " + e.message);
      }
    };
  </script>
</body>
</html>
