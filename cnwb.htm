<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wiffle Ball</title>
  <!-- Author's hosted WASM Polyfill -->
  <script src="https://dirplayer-rs.s3.us-west-2.amazonaws.com/dirplayer-polyfill-latest.js"></script>
  <style>
    body {
      background-color: #0d1117;
      color: #f0f6fc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      font-family: system-ui, sans-serif;
    }
    #game-container {
      width: 640px;
      height: 480px;
      border: 2px solid #30363d;
      border-radius: 8px;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>

  <h1>Wiffle Ball</h1>

  <!-- Points directly to the preloader file -->
<embed src="nwwbload.dcr" type="application/x-director" width="640" height="480">

  <script>
    // Intercept Lingo quit() calls to prevent browser-side alerts
    window.quit = function() {
      console.warn("Lingo triggered quit() - intercepted to keep player active.");
    };

    window.addEventListener('DOMContentLoaded', () => {
      if (window.DirPlayer) {
        DirPlayer.init();
      }
    });
  </script>

</body>
</html>
