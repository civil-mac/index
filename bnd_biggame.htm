<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bugs & Daffy XXIX The Big Game</title>
  <!-- Author's hosted WASM Polyfill -->
  <script src="https://dirplayer-rs.s3.us-west-2.amazonaws.com/dirplayer-polyfill-latest.js"></script>
  <style>
    body {
      background-color: #0d1117;
      color: #f0f6fc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      font-family: system-ui, sans-serif;
    }
    #game-container {
      width: 623px;
      height: 350px;
      border: 2px solid #30363d;
      border-radius: 8px;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>

  <h1>Bugs & Daffy XXIX The Big Game</h1>
  
  <embed 
    src="game.dcr" 
    type="application/x-director" 
    width="640" 
    height="480"
    swRemote="swVerbose='true'" 
    swParam1="--setTheRunMode"
    swLiveConnect="false"
    runmode="Standalone"
  >
</embed>

<script>
  // 1. Intercept the Lingo-to-JS bridge calls
  window.looneyReady = function() {
    console.log("looneyReady handshake intercepted successfully.");
  };

  // 2. Override internal runMode checks if exposed to global context
  window.runMode = "Standalone";

  window.addEventListener('DOMContentLoaded', () => {
    if (window.DirPlayer) {
      // 3. Pass command parameters directly into the WASM initializer
      DirPlayer.init({
        swParam1: "--setTheRunMode",
        runMode: "Standalone",
        swLiveConnect: false
      });
    }
  });
</script>

</body>
</html>
