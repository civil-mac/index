<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Candystand Minigolf</title>
  <!-- Author's hosted WASM Polyfill -->
  <script src="https://dirplayer-rs.s3.us-west-2.amazonaws.com/dirplayer-polyfill-latest.js"></script>
  <style>
    body {
      background-color: #0d1117;
      color: #f0f6fc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      font-family: system-ui, sans-serif;
    }
    #game-container {
      width: 623px;
      height: 350px;
      border: 2px solid #30363d;
      border-radius: 8px;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>

  <h1>Candystand Minigolf</h1>

  <!-- Standard Shockwave embed tag -->
  <embed src="csmgmain.dcr" type="application/x-director" width="623" height="350">

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      if (window.DirPlayer) {
        DirPlayer.init();
      }
    });
  </script>

</body>
</html>
