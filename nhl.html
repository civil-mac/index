<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NHL Goal2Goal</title>
  <!-- ProjectorRays Engine -->
  <script src="https://cdn.jsdelivr.net/gh/ProjectorRays/ProjectorRays@master/projectorrays.js"></script>
  <style>
    body {
      background-color: #0d1117;
      color: #f0f6fc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      font-family: system-ui, sans-serif;
    }
    #game-container {
      width: 623px;
      height: 350px;
      border: 2px solid #30363d;
      border-radius: 8px;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>

  <h1>NHL Goal2Goal</h1>

  <!-- Canvas Container -->
  <div id="game-container"></div>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      if (window.ProjectorRays) {
        ProjectorRays.attach({
          container: document.getElementById('game-container'),
          src: 'NHL69.dcr',
          width: 623,
          height: 350
        });
      }
    });
  </script>

</body>
</html>
